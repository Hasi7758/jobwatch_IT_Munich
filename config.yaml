# ---------- 地点:慕尼黑及周边 ----------
location:
  terms: ["münchen", "munich", "muenchen", "munchen", "garching", "unterföhring", "ismaning", "aschheim",
          "unterschleißheim", "oberschleißheim", "neubiberg", "ottobrunn", "taufkirchen", "hallbergmoos",
          "freising", "eching", "neufahrn", "planegg", "martinsried", "gräfelfing", "grünwald", "pullach",
          "neuried", "germering", "puchheim", "dachau", "karlsfeld", "erding", "starnberg", "gilching",
          "oberpfaffenhofen", "weßling", "wessling", "poing", "kirchheim", "feldkirchen", "haar", "vaterstetten",
          "parsdorf", "grasbrunn", "putzbrunn", "hohenbrunn", "unterhaching", "oberhaching", "taufkirchen",
          "brunnthal", "sauerlach", "holzkirchen", "gauting", "stockdorf", "krailling", "olching",
          "fürstenfeldbruck", "gröbenzell", "ebersberg", "markt schwaben", "wolfratshausen", "geretsried"]
  allow_remote: true     # 远程岗要带德国/欧洲字样才算(Remote US 不算)
  remote_terms: ["deutschland", "germany", "bayern", "bavaria", "europe", "emea", "eu", "dach", "münchen", "munich"]   # 远程岗须带这些字样之一
  plz_prefixes: ["80", "81", "82", "85"]   # 慕尼黑及周边邮编

# ---------- arbeitnow.com 公开源(GitHub 可达,德国全境,靠上面地点过滤) ----------
arbeitnow:
  enabled: true
  pages: 30         # 每页约 120 条,按创建时间倒序;德国全境,过滤后慕尼黑只剩一小部分,所以要多翻
  pause: 1.5        # 页间隔秒数,太快会 429

# ---------- Adzuna(可选,强烈推荐:聚合 StepStone / Indeed 等,覆盖面比 arbeitnow 大得多) ----------
# 去 https://developer.adzuna.com 免费注册拿 app_id / app_key,
# 填进仓库 Settings → Secrets → Actions:ADZUNA_APP_ID、ADZUNA_APP_KEY(daily.yml 已经会读),
# 下次运行自动启用。免费额度每天几百次,这里每天最多用 24 次。
adzuna:
  enabled: true
  where: "München"
  distance_km: 30
  max_days_old: 7
  pages: 3           # 每词最多 3 页 × 50 条
  queries: ["software engineer", "softwareentwickler", "devops", "cloud engineer", "platform engineer",
            "machine learning engineer", "ki entwickler", "backend developer"]

# ---------- 联邦劳动局官方接口 ----------
# 封了 GitHub 服务器的 IP,在 Actions 里拿不到数据;自己电脑上跑时可改成 true。
arbeitsagentur:
  enabled: false
  city: "München"
  radius_km: 25
  published_within_days: 2
  queries: ["Softwareentwickler", "Software Engineer", "DevOps", "Cloud Engineer", "Platform Engineer", "KI", "AI Engineer", "Machine Learning"]

# ---------- 数据清洗 ----------
filters:
  max_posted_age_days: 365

# ---------- 页面显示 ----------
display:
  max_age_days: 5
  recent_days: 2
  hide_tags: []      # 想整体隐藏某类(如 招聘中介)就写进来,仍会入库

# ---------- 推送(可选;GitHub Actions 里用 Secrets 注入)----------
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

open_browser: true
